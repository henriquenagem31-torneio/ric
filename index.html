<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Torneio Pro V7</title>
<style>
body{font-family:Arial;background:#111;color:#eee;padding:20px}
.game{padding:10px;border:1px solid #444;margin:8px 0;cursor:pointer;border-radius:8px}
.game.selected-live{border-color:#00e5a0;background:#0f2}
.game.selected-next{border-color:#3d8eff;background:#124}
.badge{display:inline-block;padding:4px 8px;border-radius:6px;margin-left:8px}
.live{background:#00e5a0;color:#000}
.next{background:#3d8eff}
</style>
</head>
<body>
<h1>Torneio Pro - V7</h1>
<p>Versão de correção para seleção de jogo em quadra.</p>

<div id="games"></div>

<script>
const games = [
 {id:'1',a:'Team1',b:'Team2'},
 {id:'2',a:'Team3',b:'Team4'}
];

let state = {
 liveId:null,
 nextId:null
};

function render(){
 const root=document.getElementById('games');
 root.innerHTML='';

 games.forEach(g=>{
   const row=document.createElement('div');
   row.className='game';

   if(state.liveId===g.id) row.classList.add('selected-live');
   if(state.nextId===g.id) row.classList.add('selected-next');

   row.innerHTML = `
     <strong>${g.a} x ${g.b}</strong>
     ${state.liveId===g.id?'<span class="badge live">EM QUADRA</span>':''}
     ${state.nextId===g.id?'<span class="badge next">PRÓXIMO</span>':''}
   `;

   row.addEventListener('click',()=>{
      if(state.liveId!==g.id){
         state.liveId=g.id;
      }else if(state.nextId!==g.id){
         state.nextId=g.id;
      }else{
         state.liveId=null;
         state.nextId=null;
      }
      render();
   });

   root.appendChild(row);
 });
}

render();
</script>
</body>
</html>

<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Torneio Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #07080f;
  --s1: #0d0e18;
  --s2: #111320;
  --border: #1d1f33;
  --border2: #252840;
  --accent: #00e5a0;
  --accent2: #00b87d;
  --accentfade: rgba(0,229,160,.10);
  --blue: #3d8eff;
  --bluefade: rgba(61,142,255,.10);
  --gold: #ffbe00;
  --goldfade: rgba(255,190,0,.12);
  --silver: #8fa3b8;
  --bronze: #c87941;
  --red: #ff4d6a;
  --redfade: rgba(255,77,106,.10);
  --text: #e4e8f0;
  --muted: #4a5068;
  --dim: #2a2d44;
  --font: 'DM Sans', sans-serif;
  --mono: 'JetBrains Mono', monospace;
  --display: 'Bebas Neue', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
::-webkit-scrollbar { width: 4px; height: 4px; } ::-webkit-scrollbar-track { background: var(--bg); } ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

/* ── LAYOUT ── */
#app { min-height: 100vh; display: flex; flex-direction: column; }
.topbar { background: var(–s1); border-bottom: 1px solid var(–border); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 200; }
.logo { font-family: var(–display); font-size: 20px; letter-spacing: 2px; color: var(–accent); display: flex; align-items: center; gap: 8px; line-height: 1; }
.logo small { font-family: var(–font); font-size: 9px; font-weight: 400; letter-spacing: 3px; text-transform: uppercase; color: var(–muted); display: block; margin-top: 1px; }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.live-chip { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(–muted); }
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(–accent); animation: blink 1.5s ease-in-out infinite; flex-shrink: 0; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }
.main { flex: 1; max-width: 880px; margin: 0 auto; width: 100%; padding: 16px; }

/* ── TABS ── */
.tabs { display: flex; background: var(–bg); border: 1px solid var(–border); border-radius: 8px; padding: 3px; gap: 2px; }
.tab { padding: 5px 14px; border-radius: 5px; border: none; cursor: pointer; font-size: 12px; font-family: var(–font); font-weight: 600; letter-spacing: .3px; color: var(–muted); background: transparent; transition: all .15s; white-space: nowrap; }
.tab.on { background: var(–accent); color: #000; }
.tab:not(.on):hover { color: var(–text); }

/* ── CARDS ── */
.card { background: var(–s2); border: 1px solid var(–border); border-radius: 10px; padding: 14px; margin-bottom: 10px; position: relative; overflow: hidden; }
.card::before { content:’’; position:absolute; top:0; left:0; right:0; height:2px; background: linear-gradient(90deg,var(–accent),var(–accent2),transparent); }
.card-head { display: flex; align-items: center; gap: 7px; margin-bottom: 12px; }
.card-head .ch-dot { width: 5px; height: 5px; border-radius: 50%; background: var(–accent); flex-shrink: 0; }
.card-head .ch-label { font-family: var(–display); font-size: 13px; letter-spacing: 2px; color: var(–muted); text-transform: uppercase; }
.page-title { font-family: var(–display); font-size: 30px; letter-spacing: 3px; color: var(–text); line-height: 1; margin-bottom: 3px; }
.page-sub { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(–muted); margin-bottom: 14px; }

/* ── PIN SCREEN ── */
.pin-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(–bg); }
.pin-box { background: var(–s2); border: 1px solid var(–border); border-radius: 16px; padding: 32px 28px; width: 320px; max-width: 95vw; text-align: center; }
.pin-title { font-family: var(–display); font-size: 28px; letter-spacing: 3px; color: var(–accent); margin-bottom: 6px; }
.pin-sub { font-size: 12px; color: var(–muted); margin-bottom: 24px; }
.pin-dots { display: flex; justify-content: center; gap: 12px; margin-bottom: 24px; }
.pin-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(–border2); background: transparent; transition: all .2s; }
.pin-dot.filled { background: var(–accent); border-color: var(–accent); }
.pin-dot.error { background: var(–red); border-color: var(–red); animation: shake .3s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
.pin-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
.pin-key { background: var(–s1); border: 1px solid var(–border); border-radius: 10px; padding: 14px; font-size: 20px; font-family: var(–display); letter-spacing: 2px; color: var(–text); cursor: pointer; transition: all .1s; user-select: none; }
.pin-key:active, .pin-key:hover { background: var(–accent); color: #000; border-color: var(–accent); transform: scale(.96); }
.pin-key.del { font-size: 14px; font-family: var(–font); font-weight: 700; }
.pin-err { color: var(–red); font-size: 12px; height: 20px; margin-top: 8px; }

/* ── COURT BANNERS ── */
.banner { border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; position: relative; overflow: hidden; }
.banner::before { content:’’; position:absolute; top:0; left:0; right:0; height:3px; }
.banner-live { background: linear-gradient(135deg,rgba(0,229,160,.12),rgba(0,229,160,.04)); border: 1px solid rgba(0,229,160,.35); }
.banner-live::before { background: linear-gradient(90deg,var(–accent),rgba(0,229,160,.3),transparent); }
.banner-next { background: linear-gradient(135deg,rgba(61,142,255,.12),rgba(61,142,255,.04)); border: 1px solid rgba(61,142,255,.35); }
.banner-next::before { background: linear-gradient(90deg,var(–blue),rgba(61,142,255,.3),transparent); }
.banner-lbl { font-size: 9px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; margin-bottom: 10px; display: flex; align-items: center; gap: 7px; }
.banner-lbl.live-lbl { color: var(–accent); }
.banner-lbl.next-lbl { color: var(–blue); }
.banner-teams { display: flex; align-items: center; gap: 8px; }
.banner-team { flex: 1; text-align: center; font-family: var(–display); font-size: 17px; letter-spacing: 1px; padding: 9px 6px; border-radius: 7px; }
.banner-team.live-team { background: rgba(0,229,160,.1); border: 1px solid rgba(0,229,160,.18); color: var(–text); }
.banner-team.next-team { background: rgba(61,142,255,.1); border: 1px solid rgba(61,142,255,.18); color: var(–text); }
.banner-vs { font-family: var(–display); font-size: 20px; opacity: .5; padding: 0 6px; flex-shrink: 0; }
.banner-score { font-family: var(–mono); font-size: 26px; font-weight: 700; min-width: 34px; text-align: center; color: var(–accent); flex-shrink: 0; }
.banner-ctx { font-size: 10px; text-align: center; margin-top: 8px; opacity: .6; }
.banner-ctx.live-ctx { color: var(–accent); }
.banner-ctx.next-ctx { color: var(–blue); }

/* ── GAME ROWS ── */
.game-list { display: flex; flex-direction: column; gap: 4px; }
.game-row { display: flex; align-items: center; gap: 6px; padding: 7px 8px; border-radius: 7px; border: 1px solid transparent; transition: all .15s; }
.game-row.pending { border-color: var(–border); }
.game-row.done { border-color: rgba(29,31,51,.5); opacity: .7; }
.game-row.is-live { border-color: rgba(0,229,160,.5); background: rgba(0,229,160,.07); animation: glow-live 3s ease-in-out infinite; }
.game-row.is-next { border-color: rgba(61,142,255,.4); background: rgba(61,142,255,.06); }
@keyframes glow-live { 0%,100%{border-color:rgba(0,229,160,.5)} 50%{border-color:rgba(0,229,160,.2)} }
.g-num { font-family: var(–mono); font-size: 9px; color: var(–muted); min-width: 22px; text-align: right; flex-shrink: 0; }
.g-team { flex: 1; font-size: 12px; font-weight: 500; padding: 5px 8px; background: var(–s1); border-radius: 5px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: color .15s; }
.g-team.winner { color: var(–gold); font-weight: 700; }
.g-score { width: 36px; text-align: center; font-family: var(–mono); font-size: 13px; font-weight: 700; color: var(–muted); flex-shrink: 0; }
.g-score.winner { color: var(–gold); }
.g-score-inp { width: 36px; text-align: center; background: var(–bg); border: 1px solid var(–border2); border-radius: 5px; color: var(–text); font-family: var(–mono); font-size: 13px; font-weight: 700; padding: 4px 2px; outline: none; transition: border-color .15s; flex-shrink: 0; -moz-appearance: textfield; }
.g-score-inp::-webkit-inner-spin-button, .g-score-inp::-webkit-outer-spin-button { -webkit-appearance: none; }
.g-score-inp:focus { border-color: var(–accent); }
.g-vs { font-size: 10px; color: var(–muted); font-weight: 700; flex-shrink: 0; padding: 0 1px; }
.g-badge { font-size: 8px; font-weight: 700; letter-spacing: 1px; flex-shrink: 0; }
.g-badge.live-badge { color: var(–accent); }
.g-badge.next-badge { color: var(–blue); }
.g-ok { font-size: 10px; color: var(–accent); flex-shrink: 0; }

/* ── COURT SELECTOR (ADMIN) ── */
.court-pick { display: flex; gap: 4px; flex-shrink: 0; }
.cp-btn { border: none; border-radius: 4px; padding: 3px 7px; font-size: 9px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; cursor: pointer; font-family: var(–font); transition: all .15s; }
.cp-live { background: rgba(0,229,160,.15); color: var(–accent); border: 1px solid rgba(0,229,160,.3); }
.cp-live:hover, .cp-live.on { background: var(–accent); color: #000; }
.cp-next { background: rgba(61,142,255,.15); color: var(–blue); border: 1px solid rgba(61,142,255,.3); }
.cp-next:hover, .cp-next.on { background: var(–blue); color: #fff; }

/* ── CLASSIFICATION TABLE ── */
.cls-wrap { overflow-x: auto; margin-bottom: 12px; }
.cls-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.cls-table th { background: var(–bg); color: var(–muted); font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; padding: 7px 8px; text-align: left; border-bottom: 1px solid var(–border); font-weight: 500; }
.cls-table th.c, .cls-table td.c { text-align: center; }
.cls-table td { padding: 9px 8px; border-bottom: 1px solid rgba(29,31,51,.5); }
.cls-table tr:last-child td { border-bottom: none; }
.cls-table tr.qualify td { background: var(–accentfade); }
.rank { width: 22px; height: 22px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; font-family: var(–mono); }
.r1 { background: rgba(255,190,0,.2); color: var(–gold); }
.r2 { background: rgba(143,163,184,.2); color: var(–silver); }
.r3 { background: rgba(200,121,65,.2); color: var(–bronze); }
.rn { background: var(–dim); color: var(–muted); }
.pts-badge { background: var(–accentfade); color: var(–accent); border: 1px solid rgba(0,229,160,.25); border-radius: 4px; padding: 1px 7px; font-family: var(–mono); font-size: 11px; font-weight: 700; }

/* ── ELIM SLOTS ── */
.elim-slot { display: flex; align-items: center; gap: 6px; padding: 9px 10px; background: var(–s1); border: 1px solid var(–border); border-radius: 7px; margin-bottom: 6px; }
.elim-lbl { font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; min-width: 56px; flex-shrink: 0; color: var(–muted); }
.elim-final { border-color: rgba(255,190,0,.4); background: linear-gradient(135deg, var(–s2), rgba(255,190,0,.06)); }
.elim-final .elim-lbl { color: var(–gold); }
.elim-third { border-color: rgba(200,121,65,.35); }
.elim-third .elim-lbl { color: var(–bronze); }
.elim-semi .elim-lbl { color: #a78bfa; }
.elim-slot.is-live { border-color: rgba(0,229,160,.45); background: rgba(0,229,160,.06); }
.elim-slot.is-next { border-color: rgba(61,142,255,.35); background: rgba(61,142,255,.05); }

/* ── BRACKET ── */
.brk-round-title { font-family: var(–display); font-size: 13px; letter-spacing: 2px; color: var(–accent); margin: 14px 0 8px; }

/* ── BUTTONS ── */
.btn { border: none; border-radius: 7px; padding: 8px 18px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: var(–font); transition: all .15s; display: inline-flex; align-items: center; gap: 6px; letter-spacing: .2px; }
.btn-primary { background: var(–accent); color: #000; }
.btn-primary:hover { background: var(–accent2); transform: translateY(-1px); }
.btn-ghost { background: var(–s1); color: var(–muted); border: 1px solid var(–border2); }
.btn-ghost:hover { color: var(–text); border-color: var(–accent); }
.btn-danger { background: var(–redfade); color: var(–red); border: 1px solid rgba(255,77,106,.3); }
.btn-danger:hover { background: rgba(255,77,106,.2); }
.btn-sm { padding: 4px 10px; font-size: 11px; border-radius: 5px; }
.btn-blue { background: var(–bluefade); color: var(–blue); border: 1px solid rgba(61,142,255,.3); }
.btn-blue:hover { background: rgba(61,142,255,.2); }

/* ── INPUTS ── */
.inp { width: 100%; background: var(–bg); border: 1px solid var(–border2); border-radius: 7px; color: var(–text); padding: 8px 11px; font-size: 13px; font-family: var(–font); outline: none; transition: border-color .15s; }
.inp:focus { border-color: var(–accent); }
.textarea { width: 100%; background: var(–bg); border: 1px solid var(–border2); border-radius: 7px; color: var(–text); padding: 11px; font-size: 12px; font-family: var(–mono); outline: none; min-height: 130px; resize: vertical; line-height: 1.7; transition: border-color .15s; }
.textarea:focus { border-color: var(–accent); }
label.lbl { display: block; font-size: 10px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(–muted); margin-bottom: 5px; }

/* ── FORMAT GRID ── */
.fmt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0 12px; }
.fmt-card { padding: 11px 12px; background: var(–s1); border: 1px solid var(–border); border-radius: 8px; cursor: pointer; transition: all .15s; }
.fmt-card:hover, .fmt-card.sel { border-color: var(–accent); background: var(–accentfade); }
.fmt-card .fi { font-size: 18px; margin-bottom: 5px; }
.fmt-card .fn { font-size: 12px; font-weight: 700; margin-bottom: 2px; }
.fmt-card .fd { font-size: 10px; color: var(–muted); line-height: 1.4; }

/* ── NOTICES ── */
.notice { padding: 8px 12px; border-radius: 7px; font-size: 11px; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.notice-ok { background: rgba(0,229,160,.1); border: 1px solid rgba(0,229,160,.25); color: var(–accent); }
.notice-info { background: var(–bluefade); border: 1px solid rgba(61,142,255,.25); color: var(–blue); }

/* ── PODIUM ── */
.podium { display: flex; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(–border); }
.p-slot { flex: 1; text-align: center; padding: 12px 8px; border-radius: 8px; border: 1px solid transparent; }
.p1 { background: rgba(255,190,0,.1); border-color: rgba(255,190,0,.3); }
.p2 { background: rgba(143,163,184,.1); border-color: rgba(143,163,184,.2); }
.p3 { background: rgba(200,121,65,.1); border-color: rgba(200,121,65,.2); }
.p-lbl { font-size: 10px; font-weight: 700; letter-spacing: 1px; margin-bottom: 5px; }
.p-team { font-size: 13px; font-weight: 700; }

/* ── AWARDS / VOTING ── */
.award-card { background: var(–s1); border: 1px solid var(–border); border-radius: 8px; padding: 12px; margin-bottom: 8px; }
.award-title { font-family: var(–display); font-size: 16px; letter-spacing: 2px; color: var(–gold); margin-bottom: 8px; }
.vote-option { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(–bg); border: 1.5px solid var(–border); border-radius: 7px; cursor: pointer; margin-bottom: 5px; transition: all .15s; user-select: none; }
.vote-option:hover:not(.voted-mine):not(.result-mode) { border-color: var(–gold); }
.vote-option.voted-mine { border-color: var(–gold); background: rgba(255,190,0,.08); }
.vote-option.result-mode { cursor: default; }
.vote-bar-wrap { flex: 1; height: 5px; background: var(–dim); border-radius: 3px; overflow: hidden; }
.vote-bar { height: 100%; background: var(–gold); border-radius: 3px; transition: width .4s; }
.vote-pct { font-family: var(–mono); font-size: 11px; color: var(–gold); min-width: 32px; text-align: right; }
.vote-name { font-size: 12px; font-weight: 500; flex: 1; }
.vote-count { font-family: var(–mono); font-size: 10px; color: var(–muted); }
.voted-badge { font-size: 9px; font-weight: 700; color: var(–gold); letter-spacing: 1px; }

/* ── DIVIDER ── */
.divider { border: none; border-top: 1px solid var(–border); margin: 12px 0; }
.section-lbl { font-size: 9px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(–muted); margin: 14px 0 8px; padding-bottom: 5px; border-bottom: 1px solid var(–border); display: flex; align-items: center; justify-content: space-between; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.swiss-badge { background: rgba(61,142,255,.15); color: var(–blue); border: 1px solid rgba(61,142,255,.3); border-radius: 4px; padding: 2px 9px; font-family: var(–mono); font-size: 10px; font-weight: 700; }
.empty { text-align: center; padding: 50px 20px; color: var(–muted); }
.empty .ei { font-size: 44px; margin-bottom: 12px; }
.empty h2 { font-family: var(–display); font-size: 22px; letter-spacing: 2px; margin-bottom: 6px; color: var(–text); }
.tag { font-size: 9px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; padding: 2px 7px; border-radius: 3px; display: inline-block; }
.err { color: var(–red); font-size: 11px; margin-top: 6px; }
@media(max-width:580px){ .two-col{grid-template-columns:1fr} .fmt-grid{grid-template-columns:1fr} .page-title{font-size:24px} .banner-team{font-size:13px} }
</style>

</head>
<body>
<div id="app"></div>

<script>
// ══════════════════════════════════════════════════════════
//  STORAGE  (Firebase Realtime DB — free tier, no login)
//  We use a public read/write DB key stored in the app.
//  For production replace FIREBASE_URL with your own project.
// ══════════════════════════════════════════════════════════
const DB_URL = "https://torneio-ric-default-rtdb.firebaseio.com";
const DB_KEY = "torneio";

async function dbSave(data) {
  try {
    await fetch(`${DB_URL}/${DB_KEY}.json`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });
  } catch(e) { console.warn("DB save failed", e); }
}

async function dbLoad() {
  try {
    const r = await fetch(`${DB_URL}/${DB_KEY}.json`);
    if (!r.ok) return null;
    return await r.json();
  } catch(e) { return null; }
}

// ══════════════════════════════════════════════════════════
//  SCHEDULE HELPERS
// ══════════════════════════════════════════════════════════
function roundRobin(teams) {
  const list = [...teams];
  if (list.length % 2) list.push("__BYE__");
  const n = list.length, fixed = list[0], rot = list.slice(1), games = [];
  let id = 1;
  for (let r = 0; r < n - 1; r++) {
    const c = [fixed, ...rot];
    for (let i = 0; i < n / 2; i++) {
      const a = c[i], b = c[n-1-i];
      if (a !== "__BYE__" && b !== "__BYE__") games.push({ id: id++, a, b, sA: null, sB: null });
    }
    rot.unshift(rot.pop());
  }
  return games;
}

function calcStats(teams, games) {
  const s = {};
  teams.forEach(t => { s[t] = { w:0, d:0, l:0, pts:0, gf:0, ga:0, played:0 }; });
  (games||[]).forEach(g => {
    if (g.sA===null||g.sB===null) return;
    const a=+g.sA, b=+g.sB;
    if (!s[g.a]||!s[g.b]) return;
    s[g.a].played++; s[g.b].played++;
    s[g.a].gf+=a; s[g.a].ga+=b; s[g.b].gf+=b; s[g.b].ga+=a;
    if (a>b){s[g.a].w++;s[g.a].pts+=3;s[g.b].l++;}
    else if(b>a){s[g.b].w++;s[g.b].pts+=3;s[g.a].l++;}
    else{s[g.a].d++;s[g.a].pts++;s[g.b].d++;s[g.b].pts++;}
  });
  return teams.map(t=>({team:t,...s[t],diff:s[t].gf-s[t].ga}))
    .sort((a,b)=>b.pts-a.pts||b.w-a.w||b.diff-a.diff||b.gf-a.gf);
}

function pow2(n){let p=1;while(p<n)p*=2;return p;}
function rndName(n){return n===1?"Final 🏆":n===2?"Semifinal":n===4?"Quartas de Final":n===8?"Oitavas":`Round de ${n*2}`;}

function buildBracket(seeds) {
  const sz = pow2(seeds.length);
  const seeded = [];
  for (let i=0;i<sz/2;i++) seeded.push(i,sz-1-i);
  let cur = seeded.map(i=>seeds[i]||null);
  const rounds=[]; let rn=1;
  while(cur.length>1){
    const games=[];
    for(let i=0;i<cur.length;i+=2)
      games.push({id:`R${rn}G${i/2+1}`,a:cur[i],b:cur[i+1],sA:null,sB:null});
    rounds.push({rn,name:rndName(cur.length/2),games});
    cur=games.map(()=>null);rn++;
  }
  return rounds;
}

function propagateBracket(rounds) {
  const r = JSON.parse(JSON.stringify(rounds));
  for(let ri=0;ri<r.length-1;ri++){
    r[ri].games.forEach((g,gi)=>{
      if(g.sA===null||g.sB===null) return;
      const w = +g.sA>+g.sB?g.a:+g.sB>+g.sA?g.b:null;
      if(!w) return;
      const ni=Math.floor(gi/2);
      if(r[ri+1].games[ni]){if(gi%2===0)r[ri+1].games[ni].a=w;else r[ri+1].games[ni].b=w;}
    });
  }
  return r;
}

function swissPair(teams, prevGames, standing) {
  const sorted=[...standing].sort((a,b)=>b.pts-a.pts||b.diff-a.diff);
  const done=new Set(); const games=[]; let id=(prevGames?.length||0)+1;
  for(let i=0;i<sorted.length;i++){
    if(done.has(sorted[i].team)) continue;
    for(let j=i+1;j<sorted.length;j++){
      if(done.has(sorted[j].team)) continue;
      if(!prevGames?.some(g=>(g.a===sorted[i].team&&g.b===sorted[j].team)||(g.b===sorted[i].team&&g.a===sorted[j].team))){
        games.push({id:id++,a:sorted[i].team,b:sorted[j].team,sA:null,sB:null});
        done.add(sorted[i].team);done.add(sorted[j].team);break;
      }
    }
  }
  return games;
}

function getAllGames(t) {
  if (!t) return [];
  const res = [];
  const push=(g,ctx,key)=>res.push({...g,ctx,key:key||`${ctx}-${g.id}`});
  if(t.fmt==="sg") t.games?.forEach(g=>push(g,"Grupo"));
  if(t.fmt==="mg"||t.fmt==="mgk"){
    Object.entries(t.groups||{}).forEach(([k,grp])=>grp.games.forEach(g=>push(g,k,`g-${k}-${g.id}`)));
    t.brk?.forEach(r=>r.games.forEach((g,i)=>push(g,r.name,`br-${r.rn}-${i}`)));
  }
  if(t.fmt==="se"){
    t.brk?.forEach(r=>r.games.forEach((g,i)=>push(g,r.name,`se-${r.rn}-${i}`)));
    if(t.tp) push({...t.tp,id:"TP"},"3º Lugar","tp");
  }
  if(t.fmt==="sw"){
    t.curG?.forEach(g=>push(g,`Rodada ${t.round}`));
    t.allG?.forEach(g=>push(g,"Anteriores"));
  }
  if(t.finals?.thirdGame) push({...t.finals.thirdGame,id:"F3"},"3º Lugar","final-3");
  if(t.finals?.finalGame) push({...t.finals.finalGame,id:"FF"},"Final 🏆","final-f");
  return res;
}

function parseText(txt) {
  const lines=txt.split("\n").map(l=>l.trim()).filter(Boolean);
  let title="",fmt="sg",qpg=2,swR=4;
  const groups={}; let allT=[];
  lines.forEach(l=>{
    const lo=l.toLowerCase();
    if(lo.match(/t[íi]tulo\s*:/)) title=l.replace(/t[íi]tulo\s*:/i,"").trim();
    if(lo.includes("mata-mata")||lo.includes("chaveamento")) fmt="se";
    if(lo.includes("suíço")||lo.includes("suico")||lo.includes("swiss")) fmt="sw";
    if(lo.match(/grupo[^:]*:/)){
      const k=(l.match(/grupo[^:]+/i)?.[0]||"Grupo").trim().toUpperCase();
      const ts=l.replace(/grupo[^:]+:/i,"").split(",").map(s=>s.trim()).filter(Boolean);
      if(lo.includes("único")||lo.includes("unico")){allT.push(...ts);fmt="sg";}
      else groups[k]=ts;
    }
    if(lo.includes("equipes:")||lo.includes("participantes:"))
      allT.push(...l.replace(/equipes:|participantes:/i,"").split(",").map(s=>s.trim()).filter(Boolean));
    const rm=lo.match(/rodadas?\s*[:\-]?\s*(\d+)/);if(rm)swR=+rm[1];
  });
  if(Object.keys(groups).length>=2) fmt="mg";
  return{title,fmt,groups,allT,qpg,swR};
}

function buildTournament(p) {
  const base={title:p.title,fmt:p.fmt,liveId:null,nextId:null,awards:[],votes:{},votingOpen:false,createdAt:Date.now()};
  if(p.fmt==="sg") return{...base,teams:p.allT,games:roundRobin(p.allT),finals:null};
  if(p.fmt==="mg"){
    const gd={};Object.entries(p.groups).forEach(([k,t])=>{gd[k]={teams:t,games:roundRobin(t)};});
    return{...base,groups:gd,qpg:p.qpg,brk:null};
  }
  if(p.fmt==="se"){
    const t=p.allT.length?p.allT:Object.values(p.groups).flat();
    return{...base,teams:t,brk:buildBracket(t),tp:{sA:null,sB:null}};
  }
  if(p.fmt==="sw"){
    const t=p.allT.length?p.allT:Object.values(p.groups).flat();
    return{...base,teams:t,swR:p.swR,round:1,allG:[],curG:swissPair(t,[],calcStats(t,[]))};
  }
  return base;
}

//  PERSISTENCE
// ══════════════════════════════════════════════════════════
async function persistTournament(t) {
  STATE.tournament = t;
  STATE.lastUpdated = Date.now();
  render();
  await dbSave({ tournament: t, updatedAt: STATE.lastUpdated });
}

let pollInterval = null;
async function startPolling() {
  const data = await dbLoad();
  if (data && data.tournament) {
    STATE.tournament = data.tournament;
    STATE.lastUpdated = data.updatedAt;
    render();
  }
  if (pollInterval) clearInterval(pollInterval);
  pollInterval = setInterval(async () => {
    const d = await dbLoad();
    if (d && d.tournament) {
      STATE.tournament = d.tournament;
      STATE.lastUpdated = d.updatedAt;
      render();
    }
  }, 4000);
}
startPolling();

function winner(sA, sB, a, b) {
  if (sA===null||sB===null) return null;
  return +sA>+sB?a:+sB>+sA?b:null;
}
function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  Object.entries(attrs||{}).forEach(([k,v])=>{
    if (k==="class") e.className=v;
    else if (k==="style") Object.assign(e.style, v);
    else if (k.startsWith("on")) e.addEventListener(k.slice(2).toLowerCase(), v);
    else e.setAttribute(k,v);
  });
  children.forEach(c=>{
    if (c===null||c===undefined) return;
    e.appendChild(typeof c==="string"?document.createTextNode(c):c);
  });
  return e;
}
function div(cls,...children){ return el("div",{"class":cls},...children); }
function span(cls,txt){ return el("span",{"class":cls},txt); }
function btn(cls,txt,onclick){ return el("button",{"class":"btn "+cls,onClick:onclick},txt); }

  app.appendChild(main);
}

function renderPinScreen() {
  const wrap = div("pin-wrap");
  const box = div("pin-box");
  box.appendChild(el("div",{"class":"pin-title"},"ADMIN"));
  box.appendChild(el("div",{"class":"pin-sub"},"Digite o PIN de 4 dígitos"));

  const dots = div("pin-dots");
  for(let i=0;i<4;i++){
    const d = div("pin-dot" + (i<STATE.pinInput.length?" filled":"") + (STATE.pinError?" error":""));
    dots.appendChild(d);
  }
  box.appendChild(dots);

  const grid = div("pin-grid");
  const keys = ["1","2","3","4","5","6","7","8","9","","0","⌫"];
  keys.forEach(k=>{
    if(k===""){grid.appendChild(div("pin-key"));return;}
    const btn = el("div",{"class":"pin-key"+(k==="⌫"?" del":""),onClick:()=>handlePin(k)},k);
    grid.appendChild(btn);
  });
  box.appendChild(grid);

  const errEl = div("pin-err");
  if(STATE.pinError) errEl.textContent="PIN incorreto. Tente novamente.";
  box.appendChild(errEl);
  wrap.appendChild(box);
  return wrap;
}

function handlePin(k) {
  if(k==="⌫"){
    setState({pinInput:STATE.pinInput.slice(0,-1),pinError:false});
    return;
  }
  const next = STATE.pinInput + k;
  if(next.length<4){ setState({pinInput:next,pinError:false}); return; }
  if(next===ADMIN_PIN){
    setState({adminUnlocked:true,pinInput:"",pinError:false,view:"admin",adminTab:STATE.tournament?"manage":"create"});
  } else {
    setState({pinInput:"",pinError:true});
    setTimeout(()=>setState({pinError:false}),800);
  }
}

  const awards = t.awards || [];

  const card = div("card");
  card.appendChild(renderCardHead("Gerenciar Prêmios"));

  // Add new award
  const addRow = el("div",{"style":{display:"flex",gap:"8px",marginBottom:"12px",flexWrap:"wrap"}});
  const nameInp = el("input",{"class":"inp","placeholder":"Ex: MVP, Melhor Ataque, Fair Play...","style":{flex:"1",minWidth:"160px"}});
  addRow.appendChild(nameInp);

  // Team candidates — all teams in tournament
  const allTeams = [];
  if(t.teams) allTeams.push(...t.teams);
  if(t.groups) Object.values(t.groups).forEach(g=>allTeams.push(...g.teams));

  addRow.appendChild(btn("btn-primary btn-sm","+ Criar Prêmio",()=>{
    const name = nameInp.value.trim();
    if(!name) return;
    const newAward = { id: Date.now().toString(), name, candidates: [...allTeams], enabled: true };
    persistTournament({...t, awards:[...awards, newAward], votes:{...t.votes,[newAward.id]:{}}});
    nameInp.value="";
  }));
  card.appendChild(addRow);

  if(awards.length===0){
    card.appendChild(el("p",{"style":{fontSize:"12px",color:"var(--muted)",padding:"10px 0"}},"Nenhum prêmio criado ainda."));
  }

  awards.forEach(award=>{
    const ac = div("award-card");
    const hdr = el("div",{"style":{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"8px"}});
    hdr.appendChild(el("div",{"class":"award-title"},`🏅 ${award.name}`));
    const acts = el("div",{"style":{display:"flex",gap:"6px",flexWrap:"wrap"}});

    // Toggle voting
    const votingEnabled = t.votingOpen;
    acts.appendChild(btn(votingEnabled?"btn-danger btn-sm":"btn-blue btn-sm",votingEnabled?"🔒 Fechar Votação":"🗳 Abrir Votação",()=>{
      persistTournament({...t,votingOpen:!votingEnabled});
    }));
    acts.appendChild(btn("btn-danger btn-sm","🗑",()=>{
      const newAwards = awards.filter(a=>a.id!==award.id);
      const newVotes = {...t.votes}; delete newVotes[award.id];
      persistTournament({...t,awards:newAwards,votes:newVotes});
    }));
    hdr.appendChild(acts);
    ac.appendChild(hdr);

    // Vote results
    const awardVotes = t.votes?.[award.id] || {};
    const totalVotes = Object.values(awardVotes).length;
    const tally = {};
    Object.values(awardVotes).forEach(v=>{ tally[v]=(tally[v]||0)+1; });

    ac.appendChild(el("div",{"style":{fontSize:"10px",color:"var(--muted)",marginBottom:"6px"}},`${totalVotes} voto${totalVotes!==1?"s":""} registrado${totalVotes!==1?"s":""}`));

    award.candidates.forEach(team=>{
      const count = tally[team]||0;
      const pct = totalVotes>0?Math.round((count/totalVotes)*100):0;
      const row = div("vote-option result-mode",{"style":{"cursor":"default"}});
      row.appendChild(el("span",{"class":"vote-name"},team));
      const bw = div("vote-bar-wrap");
      bw.appendChild(el("div",{"class":"vote-bar","style":{width:`${pct}%`}}));
      row.appendChild(bw);
      row.appendChild(el("span",{"class":"vote-pct"},`${pct}%`));
      row.appendChild(el("span",{"class":"vote-count"},`(${count})`));
      ac.appendChild(row);
    });
    card.appendChild(ac);
  });

  wrap.appendChild(card);
  return wrap;
}

// ══════════════════════════════════════════════════════════
//  AWARDS PUBLIC
// ══════════════════════════════════════════════════════════
function renderAwardsPublic(t) {
  const wrap = div("");
  const awards = t.awards || [];
  if(!awards.length) return wrap;

  const card = div("card");
  card.appendChild(renderCardHead("🏅 Prêmios & Votação"));

  awards.forEach(award=>{
    const ac = div("award-card");
    ac.appendChild(el("div",{"class":"award-title"},`🏅 ${award.name}`));

    const awardVotes = t.votes?.[award.id]||{};
    const totalVotes = Object.values(awardVotes).length;
    const tally = {};
    Object.values(awardVotes).forEach(v=>{ tally[v]=(tally[v]||0)+1; });

    const myVote = STATE.voteId[award.id];
    const canVote = t.votingOpen && !myVote;

    if(!t.votingOpen && !myVote){
      ac.appendChild(el("p",{"style":{fontSize:"11px",color:"var(--muted)",marginBottom:"8px"}},"Votação não aberta ainda."));
    }

    award.candidates.forEach(team=>{
      const count = tally[team]||0;
      const pct = totalVotes>0?Math.round((count/totalVotes)*100):0;
      const isMine = myVote===team;
      const row = el("div",{"class":`vote-option${isMine?" voted-mine":""}${!canVote?" result-mode":""}`,
        onClick: canVote?()=>handleVote(t, award.id, team):null
      });
      row.appendChild(el("span",{"class":"vote-name"},team));
      if(myVote||!t.votingOpen){
        const bw = div("vote-bar-wrap");
        bw.appendChild(el("div",{"class":"vote-bar","style":{width:`${pct}%`}}));
        row.appendChild(bw);
        row.appendChild(el("span",{"class":"vote-pct"},`${pct}%`));
      }
      if(isMine) row.appendChild(span("voted-badge","✓ SEU VOTO"));
      ac.appendChild(row);
    });

    if(canVote) ac.appendChild(el("p",{"style":{fontSize:"10px",color:"var(--muted)",marginTop:"6px"}},"Toque em um nome para votar. Apenas 1 voto por dispositivo."));
    card.appendChild(ac);
  });

  wrap.appendChild(card);
  return wrap;
}

async function handleVote(t, awardId, team) {
  const sessionId = getSessionId();
  const newVotes = {
    ...(t.votes||{}),
    [awardId]: { ...(t.votes?.[awardId]||{}), [sessionId]: team }
  };
  STATE.voteId = { ...STATE.voteId, [awardId]: team };
  await persistTournament({ ...t, votes: newVotes });
}

function getSessionId() {
  let sid = localStorage.getItem("torneio-session");
  if (!sid) { sid = Math.random().toString(36).slice(2); localStorage.setItem("torneio-session", sid); }
  return sid;
}

// ══════════════════════════════════════════════════════════

// ══════════════════════════════════════════════════════════
function renderCourtBanners(t) {

    b.appendChild(lbl);
    const teams = div("banner-teams");
    teams.appendChild(el("span",{"class":"banner-team live-team"},liveG.a));
    if(liveG.sA!==null&&liveG.sB!==null){
      teams.appendChild(el("span",{"class":"banner-score"},String(liveG.sA)));
      teams.appendChild(el("span",{"class":"banner-vs","style":{"color":"var(--accent)"}},`×`));
      teams.appendChild(el("span",{"class":"banner-score"},String(liveG.sB)));
    } else {
      teams.appendChild(el("span",{"class":"banner-vs","style":{"color":"var(--accent)","padding":"0 14px","fontSize":"22px"}},`×`));

    wrap.appendChild(b);
  }

  if(nextG){
    const b = div("banner banner-next");
    const lbl = div("banner-lbl next-lbl");
    lbl.appendChild(div("next-dot",{"style":{width:"8px",height:"8px",borderRadius:"50%",background:"var(--blue)",flexShrink:"0"}}));
    lbl.appendChild(document.createTextNode("PRÓXIMO JOGO"));
    b.appendChild(lbl);
    const teams = div("banner-teams");
    teams.appendChild(el("span",{"class":"banner-team next-team"},nextG.a));
    teams.appendChild(el("span",{"class":"banner-vs","style":{"color":"var(--blue)","padding":"0 14px","fontSize":"22px"}},`×`));

    b.appendChild(teams);
    b.appendChild(el("div",{"class":"banner-ctx next-ctx"},nextG.ctx));
    wrap.appendChild(b);
  }
  return wrap;
}

// ══════════════════════════════════════════════════════════
//  TOURNAMENT ROUTER
// ══════════════════════════════════════════════════════════
function renderTournament(t, readOnly) {
  if(t.fmt==="sg") return renderSingleGroup(t, readOnly);
  if(t.fmt==="mg") return renderMultiGroup(t, readOnly);
  if(t.fmt==="se") return renderSingleElim(t, readOnly);
  if(t.fmt==="sw") return renderSwiss(t, readOnly);
  return div("");
}

// ──────────────────────────────────────────────────────────
//  SINGLE GROUP
// ──────────────────────────────────────────────────────────
function renderSingleGroup(t, readOnly) {
  const wrap = div("");
  const ranking = calcStats(t.teams, t.games);
  const allDone = t.games.every(g=>g.sA!==null&&g.sB!==null);
  const top2 = ranking.slice(0,2).map(r=>r.team);
  const mid = ranking.slice(2,4).map(r=>r.team);
  const finals = t.finals||{finalGame:{sA:null,sB:null},thirdGame:{sA:null,sB:null}};

  wrap.appendChild(renderClassTable(ranking, true));

  const gc = div("card");
  gc.appendChild(renderCardHead("Jogos — Fase de Grupos"));
  gc.appendChild(renderGameList(t.games, readOnly, t, (id,field,val)=>{
    const games = t.games.map(g=>g.id===id?{...g,[field]:val===""?null:+val}:g);
    persistTournament({...t,games});
  }));
  wrap.appendChild(gc);

  if(allDone||!readOnly){
    const fc = div("card");
    fc.appendChild(renderCardHead("Fase Final"));
    if(mid.length>=2){
      fc.appendChild(renderElimSlot("3º Lugar",mid[0],mid[1],finals.thirdGame?.sA,finals.thirdGame?.sB,"elim-third",readOnly,t,"final-3",(f,v)=>{
        persistTournament({...t,finals:{...finals,thirdGame:{...finals.thirdGame,[f]:v===""?null:+v}}});
      }));
    }
    if(top2.length===2){
      fc.appendChild(renderElimSlot("Final 🏆",top2[0],top2[1],finals.finalGame?.sA,finals.finalGame?.sB,"elim-final",readOnly,t,"final-f",(f,v)=>{
        persistTournament({...t,finals:{...finals,finalGame:{...finals.finalGame,[f]:v===""?null:+v}}});
      }));
    }
    const fw = winner(finals.finalGame?.sA,finals.finalGame?.sB,top2[0],top2[1]);
    const tw = winner(finals.thirdGame?.sA,finals.thirdGame?.sB,mid[0],mid[1]);
    if(fw||tw) fc.appendChild(renderPodium(fw,top2.find(x=>x!==fw),tw));
    wrap.appendChild(fc);
  }
  return wrap;
}

// ──────────────────────────────────────────────────────────
//  MULTI GROUP
// ──────────────────────────────────────────────────────────
function renderMultiGroup(t, readOnly) {
  const wrap = div("");
  const gkeys = Object.keys(t.groups);
  const rankings = {};
  gkeys.forEach(k=>{ rankings[k]=calcStats(t.groups[k].teams,t.groups[k].games); });
  const allDone = gkeys.every(k=>t.groups[k].games.every(g=>g.sA!==null&&g.sB!==null));
  const colors = ["var(--accent)","var(--blue)","#f472b6","#fb923c","#a78bfa","#f87171"];

  const twoCol = div("two-col");
  gkeys.forEach((k,gi)=>{
    const gc = div("card");
    const ch = renderCardHead(k);
    ch.querySelector(".ch-dot").style.background=colors[gi%colors.length];
    ch.querySelector(".ch-label").style.color=colors[gi%colors.length];
    gc.appendChild(ch);
    gc.appendChild(renderClassTable(rankings[k],false));
    gc.appendChild(el("hr",{"class":"divider"}));
    gc.appendChild(renderGameList(t.groups[k].games,readOnly,t,(id,field,val)=>{
      const grp={...t.groups[k],games:t.groups[k].games.map(g=>g.id===id?{...g,[field]:val===""?null:+val}:g)};
      persistTournament({...t,groups:{...t.groups,[k]:grp}});
    },k));
    twoCol.appendChild(gc);
  });
  wrap.appendChild(twoCol);

  if(allDone||!readOnly){
    const ec = div("card");
    ec.appendChild(renderCardHead("Fase Eliminatória"));
    const q=t.qpg||2;
    const qualified=gkeys.flatMap(k=>rankings[k].slice(0,q).map(r=>r.team));
    if(!t.brk&&!readOnly&&allDone){
      const n = div("notice notice-info");
      n.appendChild(document.createTextNode("Grupos concluídos! "));
      n.appendChild(btn("btn-primary btn-sm","Gerar Chaveamento",()=>persistTournament({...t,brk:buildBracket(qualified)})));
      ec.appendChild(n);
    }
    if(t.brk) ec.appendChild(renderBracket(t.brk,readOnly,t,(rounds)=>persistTournament({...t,brk:rounds})));
    wrap.appendChild(ec);
  }
  return wrap;
}

// ──────────────────────────────────────────────────────────
//  SINGLE ELIM
// ──────────────────────────────────────────────────────────
function renderSingleElim(t, readOnly) {
  const wrap = div("");
  const n = div("notice notice-info");
  n.innerHTML=`<span>🔱</span> ${t.teams.length} equipes · ${t.brk?.length} rodadas`;
  wrap.appendChild(n);
  if(t.brk) wrap.appendChild(renderBracket(t.brk,readOnly,t,(r)=>persistTournament({...t,brk:r})));

  const semiRound = t.brk?.[t.brk.length-2];
  const finalRound = t.brk?.[t.brk.length-1];
  const finalG = finalRound?.games?.[0];
  const fw = winner(finalG?.sA,finalG?.sB,finalG?.a,finalG?.b);
  const fl = fw?(fw===finalG?.a?finalG?.b:finalG?.a):null;
  const semiLosers = semiRound?.games?.map(g=>{ const w=winner(g.sA,g.sB,g.a,g.b); return w?(w===g.a?g.b:g.a):null; }).filter(Boolean)||[];

  if(semiLosers.length===2){
    const tc = div("card");
    tc.appendChild(renderCardHead("3º Lugar"));
    const tp = t.tp||{sA:null,sB:null};
    tc.appendChild(renderElimSlot("3º Lugar",semiLosers[0],semiLosers[1],tp.sA,tp.sB,"elim-third",readOnly,t,"tp",(f,v)=>{
      persistTournament({...t,tp:{...tp,[f]:v===""?null:+v}});
    }));
    const tw = winner(tp.sA,tp.sB,semiLosers[0],semiLosers[1]);
    if(fw||tw) tc.appendChild(renderPodium(fw,fl,tw));
    wrap.appendChild(tc);
  }
  return wrap;
}

// ──────────────────────────────────────────────────────────
//  SWISS
// ──────────────────────────────────────────────────────────
function renderSwiss(t, readOnly) {
  const wrap = div("");
  const standing = calcStats(t.teams, t.allG||[]);
  const allPlayed = t.curG?.every(g=>g.sA!==null&&g.sB!==null);
  const done = t.round > t.swR;

  const sb = el("div",{"style":{display:"flex",alignItems:"center",gap:"8px",marginBottom:"10px"}});
  sb.appendChild(el("span",{"class":"swiss-badge"},`Rodada ${t.round} / ${t.swR}`));
  if(done) sb.appendChild(el("span",{"style":{fontSize:"12px",color:"var(--gold)"}},"🏆 Torneio encerrado"));
  wrap.appendChild(sb);

  wrap.appendChild(renderClassTable(standing, true));

  const gc = div("card");
  gc.appendChild(renderCardHead(`Rodada ${t.round}`));
  gc.appendChild(renderGameList(t.curG||[],readOnly,t,(id,field,val)=>{
    const curG = t.curG.map(g=>g.id===id?{...g,[field]:val===""?null:+val}:g);
    persistTournament({...t,curG});
  }));
  if(!readOnly&&allPlayed&&t.round<t.swR){
    const nb = btn("btn-primary btn-sm","▶ Próxima Rodada",()=>{
      const all=[...(t.allG||[]),...t.curG];
      persistTournament({...t,allG:all,curG:swissPair(t.teams,all,calcStats(t.teams,all)),round:t.round+1});
    });
    gc.appendChild(el("div",{"style":{marginTop:"10px"}},nb));
  }
  wrap.appendChild(gc);

  if(done) wrap.appendChild(el("div",{"class":"card"},renderPodium(standing[0]?.team,standing[1]?.team,standing[2]?.team)));
  return wrap;
}

// ══════════════════════════════════════════════════════════
//  REUSABLE COMPONENTS
// ══════════════════════════════════════════════════════════
function renderCardHead(label) {
  const h = div("card-head");
  h.appendChild(div("ch-dot"));
  h.appendChild(el("span",{"class":"ch-label"},label));
  return h;
}

function renderClassTable(ranking, showPts) {
  const wrap = div("cls-wrap");
  const table = el("table",{"class":"cls-table"});
  const thead = el("thead");
  const hr = el("tr");
  ["#","Equipe / Dupla","J","V","E","D","GP","GC","Saldo",...(showPts?["Pts"]:[])]
    .forEach((h,i)=>{ const th=el("th",{},h); if(i>1) th.className="c"; hr.appendChild(th); });
  thead.appendChild(hr); table.appendChild(thead);
  const tbody = el("tbody");
  const icons = ["🥇","🥈","🥉"];
  const rCls = ["r1","r2","r3"];
  ranking.forEach((r,i)=>{
    const tr = el("tr",{"class":i<2&&showPts?"qualify":""});
    const rankEl=el("span",{"class":`rank ${rCls[i]||"rn"}`},icons[i]||(i+1).toString());
    tr.appendChild(el("td",{},rankEl));
    tr.appendChild(el("td",{"style":{fontWeight:"600"}},r.team));
    [r.played,r.w,r.d,r.l,r.gf,r.ga].forEach(v=>{
      tr.appendChild(el("td",{"class":"c","style":{fontFamily:"var(--mono)",fontSize:"11px",color:"var(--muted)"}},String(v)));
    });
    const diffEl=el("td",{"class":"c","style":{fontFamily:"var(--mono)",fontSize:"11px",color:r.diff>0?"var(--accent)":r.diff<0?"var(--red)":"var(--muted)"}},`${r.diff>0?"+":""}${r.diff}`);
    tr.appendChild(diffEl);
    if(showPts) tr.appendChild(el("td",{"class":"c"},el("span",{"class":"pts-badge"},String(r.pts))));
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
  return wrap;
}

function renderGameList(games, readOnly, t, onScore, groupKey) {
  const list = div("game-list");
  games.forEach(g=>{
    const key = groupKey?`g-${groupKey}-${g.id}`:`sg-${g.id}`;
    list.appendChild(renderGameRow(g, readOnly, t, key, onScore));
  });
  return list;
}

function renderGameRow(g, readOnly, t, key, onScore) {
  const done = g.sA!==null&&g.sB!==null;
  const aW = done&&+g.sA>+g.sB, bW = done&&+g.sB>+g.sA;
  const isLive = key===t?.liveId, isNext = key===t?.nextId;
  const cls = `game-row ${isLive?"is-live":isNext?"is-next":done?"done":"pending"}`;
  const row = el("div",{"class":cls});

  const numEl = el("span",{"class":"g-num"});
  if(isLive) numEl.innerHTML=`<span style="color:var(--accent)">●</span>`;
  else if(isNext) numEl.innerHTML=`<span style="color:var(--blue)">●</span>`;
  else numEl.textContent=`#${g.id}`;
  row.appendChild(numEl);

  row.appendChild(el("span",{"class":"g-team"+(aW?" winner":"")},g.a));

  if(readOnly){
    row.appendChild(el("span",{"class":"g-score"+(aW?" winner":"")},done?String(g.sA):"—"));
    row.appendChild(el("span",{"class":"g-vs"},"×"));
    row.appendChild(el("span",{"class":"g-score"+(bW?" winner":"")},done?String(g.sB):"—"));
  } else {
    const inA = el("input",{"class":"g-score-inp","type":"number","min":"0","value":g.sA!==null?String(g.sA):""});
    const inB = el("input",{"class":"g-score-inp","type":"number","min":"0","value":g.sB!==null?String(g.sB):""});
    const commit=()=>{ if(inA.value!==""&&inB.value!==""){onScore(g.id,"sA",inA.value);onScore(g.id,"sB",inB.value);} };
    inA.addEventListener("blur",commit); inB.addEventListener("blur",commit);
    inA.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key==="Tab"){e.preventDefault();inB.focus();}});
    inB.addEventListener("keydown",e=>{if(e.key==="Enter")commit();});
    row.appendChild(inA);
    row.appendChild(el("span",{"class":"g-vs"},"×"));
    row.appendChild(inB);
  }

  row.appendChild(el("span",{"class":"g-team"+(bW?" winner":"")},g.b));

  if(isLive) row.appendChild(el("span",{"class":"g-badge live-badge"},"QUADRA"));
  else if(isNext) row.appendChild(el("span",{"class":"g-badge next-badge"},"PRÓX"));
  else if(!readOnly&&done) row.appendChild(el("span",{"class":"g-ok"},"✓"));

  return row;
}

function renderElimSlot(label, a, b, sA, sB, cls, readOnly, t, key, onScore) {
  const done=sA!==null&&sB!==null;
  const aW=done&&+sA>+sB, bW=done&&+sB>+sA;
  const isLive=key===t?.liveId, isNext=key===t?.nextId;
  const slot = el("div",{"class":`elim-slot ${cls}${isLive?" is-live":isNext?" is-next":""}`});
  slot.appendChild(el("span",{"class":"elim-lbl"},label));
  slot.appendChild(el("span",{"class":"g-team"+(aW?" winner":"")},a||"—"));

  if(readOnly){
    slot.appendChild(el("span",{"class":"g-score"+(aW?" winner":"")},done?String(sA):"—"));
    slot.appendChild(el("span",{"class":"g-vs"},"×"));
    slot.appendChild(el("span",{"class":"g-score"+(bW?" winner":"")},done?String(sB):"—"));
  } else {
    const inA=el("input",{"class":"g-score-inp","type":"number","min":"0","value":sA!==null?String(sA):""});
    const inB=el("input",{"class":"g-score-inp","type":"number","min":"0","value":sB!==null?String(sB):""});
    const commit=()=>{if(inA.value!==""&&inB.value!==""){onScore("sA",inA.value);onScore("sB",inB.value);}};
    inA.addEventListener("blur",commit);inB.addEventListener("blur",commit);
    inA.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key==="Tab"){e.preventDefault();inB.focus();}});
    inB.addEventListener("keydown",e=>{if(e.key==="Enter")commit();});
    slot.appendChild(inA);
    slot.appendChild(el("span",{"class":"g-vs"},"×"));
    slot.appendChild(inB);
  }
  slot.appendChild(el("span",{"class":"g-team"+(bW?" winner":"")},b||"—"));
  if(isLive) slot.appendChild(el("span",{"class":"g-badge live-badge"},"QUADRA"));
  else if(isNext) slot.appendChild(el("span",{"class":"g-badge next-badge"},"PRÓX"));
  return slot;
}

function renderBracket(rounds, readOnly, t, onUpdate) {
  const wrap = div("");
  rounds.forEach((rnd,ri)=>{
    wrap.appendChild(el("div",{"class":"brk-round-title"},rnd.name));
    rnd.games.forEach((g,gi)=>{
      const key=`${t.fmt==="se"?"se":"br"}-${rnd.rn}-${gi}`;
      wrap.appendChild(renderElimSlot(`J${gi+1}`,g.a,g.b,g.sA,g.sB,rnd.name==="Final 🏆"?"elim-final":rnd.name==="Semifinal"?"elim-semi":"",readOnly,t,key,(field,val)=>{
        const r=JSON.parse(JSON.stringify(rounds));
        r[ri].games[gi][field]=val===""?null:+val;
        onUpdate(propagateBracket(r));
      }));
    });
  });
  return wrap;
}

function renderPodium(first, second, third) {
  const p = div("podium");
  [{l:"🥇 Campeão",t:first,c:"p1",tc:"var(--gold)"},{l:"🥈 Vice",t:second,c:"p2",tc:"var(--silver)"},{l:"🥉 3º Lugar",t:third,c:"p3",tc:"var(--bronze)"}]
    .forEach(({l,t:team,c,tc})=>{
      const slot=el("div",{"class":`p-slot ${c}`});
      slot.appendChild(el("div",{"class":"p-lbl","style":{color:tc}},l));
      slot.appendChild(el("div",{"class":"p-team","style":{color:team?tc:"var(--muted)"}},team||"—"));
      p.appendChild(slot);
    });
  return p;
}
